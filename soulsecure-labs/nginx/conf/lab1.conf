server {
    listen 443 ssl default_server;
    server_name www.soulsecure.lab soulsecure.lab _;
    root /opt/soulsecure-lab/www;
    index index.html;

    add_header X-Powered-By "SoulSecure CloudStack (AWS us-east-1)";
    add_header Server "SoulSecure-CDN" always;
    include /etc/nginx/snippets/www-extra-headers.conf;
}

# backup-eu is a plain HTTPS vhost now (used to be port 8443 with no real
# TLS behind it -- a subdomain on the standard TLS port is both simpler and
# more realistic).
server {
    listen 443 ssl;
    server_name backup-eu.soulsecure.lab;
    root /opt/soulsecure-lab/backup;
    index index.html;

    add_header Server "SoulSecure-BackupPortal" always;
    include /etc/nginx/snippets/backup-extra.conf;
}

# --- Reverse-proxied Lab 1 services -------------------------------------
# api/storage/vpn used to be published on their own host ports (8080/8081/943).
# They're now reachable ONLY via hostname on 443, proxied internally to their
# containers over the docker-compose network -- exactly how a real
# ingress/API-gateway-fronted environment looks. A port scan of the bare IP
# now shows far fewer open ports, which is itself more realistic: most orgs
# don't expose every backend service on its own port, they expose one
# gateway and route by hostname.
#
# IMPORTANT: proxy_pass targets use a variable ($upstream_*), not a bare
# hostname, together with an explicit `resolver`. A bare hostname in
# proxy_pass gets resolved ONCE at nginx startup/config-load -- if the
# backend container isn't registered in Docker's embedded DNS yet at that
# exact moment (a real race on `docker compose up`), nginx fails validation
# and crash-loops permanently. Using a variable forces resolution at
# REQUEST time instead, against Docker's embedded DNS (127.0.0.11), so a
# backend that's still starting just means a slow first request, not a
# dead gateway.
resolver 127.0.0.11 valid=10s;

server {
    listen 443 ssl;
    server_name api.soulsecure.lab;
    location / {
        set $upstream_api api:8080;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name storage.soulsecure.lab;
    location / {
        set $upstream_storage storage:8081;
        proxy_pass http://$upstream_storage;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name vpn.soulsecure.lab;
    location / {
        set $upstream_vpn vpn:943;
        proxy_pass http://$upstream_vpn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
