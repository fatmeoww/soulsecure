# Module 5 -- bastion reverse-proxied via www on 443, same
# variable-based-proxy_pass pattern as api/storage/vpn/iam-sim in lab1.conf
# (the `resolver` directive from lab1.conf is inherited here).
server {
    listen 443 ssl;
    server_name bastion.soulsecure.lab;
    location / {
        set $upstream_bastion bastion:80;
        proxy_pass http://$upstream_bastion;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # bastion_app.py's fingerprint check reads this header directly --
        # make sure it always passes through untouched.
        proxy_set_header X-SSH-Key-Fingerprint $http_x_ssh_key_fingerprint;
    }
}
