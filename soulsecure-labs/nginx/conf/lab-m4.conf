# Module 4 -- iam-sim reverse-proxied via www on 443, same
# variable-based-proxy_pass pattern as api/storage/vpn in lab1.conf (the
# `resolver` directive from lab1.conf is inherited here -- see that file's
# comment for why a bare hostname in proxy_pass is unsafe).
server {
    listen 443 ssl;
    server_name iam.soulsecure.lab;
    location / {
        set $upstream_iam iam-sim:8600;
        proxy_pass http://$upstream_iam;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
