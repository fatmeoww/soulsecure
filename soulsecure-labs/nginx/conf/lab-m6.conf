# Module 6 -- static training-material downloads (secret-scanning dump,
# Terraform source tree, remediation checker script). Unauthenticated on
# purpose: these are handed-to-students practice materials, not something
# to "find" via recon the way every other module's assets are -- Module 6
# is about tool fluency, not discovery.
server {
    listen 443 ssl;
    server_name module6.soulsecure.lab;
    root /opt/soulsecure-lab/module6-downloads;
    autoindex on;
}
