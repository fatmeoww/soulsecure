# Header-gated vhost: vhost brute force alone gets you the "denied" teaser
# page (no DNS record either, same as internal-tools). The teaser tells you
# exactly which header unlocks the real content -- two techniques chained.
map $http_x_beta_access $beta_root {
    "enabled" /opt/soulsecure-lab/beta;
    default   /opt/soulsecure-lab/beta-denied;
}

server {
    listen 443 ssl;
    server_name beta.soulsecure.lab;
    root $beta_root;
    index index.html;
}

server {
    listen 443 ssl;
    server_name app.soulsecure.lab;
    root /opt/soulsecure-lab/www;
    index index.html;
    add_header X-Vhost "app-alias-of-www" always;
}

server {
    listen 443 ssl;
    server_name old-www.soulsecure.lab;
    root /opt/soulsecure-lab/old-www;
    index index.html;
}

server {
    listen 443 ssl;
    server_name internal-tools.soulsecure.lab;
    root /opt/soulsecure-lab/internal-tools;
    index index.html;
}

# No DNS record, never linked -- the ONLY place this hostname appears is the
# shared cert's SAN list. (The cert also covers plenty of hostnames that DO
# have DNS records now, so the technique is "cross-reference every SAN entry
# against what you already know", not "spot the one weird name" -- more
# realistic, since real orgs' SAN certs usually cover their whole portfolio.)
server {
    listen 443 ssl;
    server_name legacy-portal.soulsecure.lab;
    root /opt/soulsecure-lab/legacy-portal;
    index index.html;
}
