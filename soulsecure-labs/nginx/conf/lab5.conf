# Origin bypass: reachable directly over HTTPS via its own vhost, no DNS
# record (dns-history / staging-notes hint only, same as before) -- and no
# Age/X-Cache/SoulSecure-CDN headers, which is the tell that this is the real
# origin rather than the CDN edge (www). Used to sit on its own port (8090);
# moving it to a vhost on the standard TLS port is actually MORE realistic --
# real origin-bypass in practice is almost always "find the right hostname to
# hit directly", not "find a weird port".
server {
    listen 443 ssl;
    server_name origin-direct.soulsecure.lab;
    root /opt/soulsecure-lab/origin-direct;
    index index.html;
    add_header X-Debug-Mode "true" always;
}

# WAF-fingerprinting exercise: a canary payload in ?q= gets blocked with a
# distinctive branded response -- a classic first move in real assessments
# ("is there a WAF here, and which one") before touching anything else.
# This is detection only; nothing is actually being defended. No DNS record
# for search.soulsecure.lab either -- vhost brute force, same as the rest.
server {
    listen 443 ssl;
    server_name search.soulsecure.lab;
    location = /search {
        if ($arg_q ~* "union|select|<script|\.\./|;--") {
            add_header Server "SoulSecure-WAF/2.1" always;
            return 403 "Blocked by SoulSecure-WAF: suspicious pattern detected\n";
        }
        default_type text/plain;
        return 200 "No results for your query.\n";
    }
}
